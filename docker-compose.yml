services:
  postgres:
    image: postgres:15-alpine
    container_name: tecnipaya_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tecnipaya}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tecnipaya}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile

    container_name: tecnipaya_backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tecnipaya}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile

    container_name: tecnipaya_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

volumes:
  postgres_data:
